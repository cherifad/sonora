name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:

# One run per branch: a new push cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner's preinstalled SDK is enough; android-actions/setup-android@v3 now fails
      # on "sdkmanager tools" (the package no longer exists). AGP downloads what is missing.
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      # The JVM tests first (the Subsonic contract, the offline/download logic,
      # the queue rules): they fail fast and need no device.
      - name: Unit tests
        run: ./gradlew :api-subsonic:testDebugUnitTest :app:testMobileDebugUnitTest --console=plain

      # The same APKs a developer installs: the UI and the whole graph have to compile.
      - name: Build the debug APKs
        run: ./gradlew :app:assembleMobileDebug :app:assembleAutomotiveDebug --console=plain

      - name: Upload the phone APK
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-audio-debug
          path: app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          if-no-files-found: error
          retention-days: 14
