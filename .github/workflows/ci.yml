name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:

# One run per branch: a new push cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The capability matrix, server side: a real Navidrome, the endpoints the app calls. The
  # emulator run and Jellyfin stay manual (docs/TESTING.md).
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start Navidrome
        run: |
          docker run -d --name navidrome -p 4533:4533 \
            -e ND_DEVAUTOCREATEADMINPASSWORD=contract-only \
            -e ND_MUSICFOLDER=/music \
            -e ND_SCANSCHEDULE=0 \
            -e ND_LOGLEVEL=warn \
            deluan/navidrome:0.64.2
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4533/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Navidrome did not answer in 120 s"
          docker logs navidrome
          exit 1

      - name: Contract against Navidrome
        run: |
          python3 tools/server_contract.py \
            --url http://localhost:4533 \
            --user admin --password contract-only \
            --json

      - name: Navidrome logs on failure
        if: failure()
        run: docker logs navidrome

  # Jellyfin + Subfin, the other production target. The plugin is not in the image: it is
  # downloaded from its release and read from /config/plugins at startup.
  contract-jellyfin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the Subfin plugin
        run: |
          mkdir -p "$RUNNER_TEMP/jellyfin/config/plugins/subfin" \
                   "$RUNNER_TEMP/jellyfin/cache" "$RUNNER_TEMP/jellyfin/music"
          curl -fsSL -o "$RUNNER_TEMP/subfin.zip" \
            https://github.com/williamkray/subfin-plugin/releases/download/v10.11.5.7/jellyfin-plugin-subfin_10.11.5.7.zip
          unzip -q "$RUNNER_TEMP/subfin.zip" -d "$RUNNER_TEMP/jellyfin/config/plugins/subfin"

      - name: Start Jellyfin
        run: |
          docker run -d --name jellyfin -p 8096:8096 \
            -v "$RUNNER_TEMP/jellyfin/config:/config" \
            -v "$RUNNER_TEMP/jellyfin/cache:/cache" \
            -v "$RUNNER_TEMP/jellyfin/music:/music" \
            jellyfin/jellyfin:10.11.11

      - name: Wizard, library and Subsonic device
        run: |
          python3 tools/jellyfin_ci.py --url http://localhost:8096 --json \
            > "$RUNNER_TEMP/jellyfin.json"

      - name: Contract against Jellyfin + Subfin
        run: |
          read -r USER PASS < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["subsonicUsername"], d["password"])' "$RUNNER_TEMP/jellyfin.json")
          echo "::add-mask::$PASS"
          python3 tools/server_contract.py \
            --url http://localhost:8096 --user "$USER" --password "$PASS" --json

      - name: Jellyfin logs on failure
        if: failure()
        run: docker logs jellyfin

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner's preinstalled SDK is enough; android-actions/setup-android@v3 now fails
      # on "sdkmanager tools" (the package no longer exists). AGP downloads what is missing.
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      # The JVM tests first (the Subsonic contract, the offline/download logic,
      # the queue rules): they fail fast and need no device.
      - name: Unit tests
        run: ./gradlew :api-subsonic:testDebugUnitTest :app:testMobileDebugUnitTest --console=plain

      # The same APKs a developer installs: the UI and the whole graph have to compile.
      - name: Build the debug APKs
        run: ./gradlew :app:assembleMobileDebug :app:assembleAutomotiveDebug --console=plain

      # R8, resource shrinking and lint-vital: a release that only fails at tag time
      # would ship broken. Local builds use the debug key, so no secret is needed.
      - name: Release build (R8)
        run: ./gradlew :app:assembleMobileRelease --console=plain

      - name: Upload the phone APK
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug
          path: app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          if-no-files-found: error
          retention-days: 14
