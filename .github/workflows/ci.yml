name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# One run per branch: a new push cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The JVM tests first (the Subsonic contract, the offline/download logic,
      # the queue rules): they fail fast and need no device.
      - name: Unit tests
        run: ./gradlew :api-subsonic:testDebugUnitTest :app:testDebugUnitTest --console=plain

      # The same APK a developer installs: the UI and the whole graph have to compile.
      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-audio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
