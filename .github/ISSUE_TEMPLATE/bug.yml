name: Bug report
description: Something is broken in Sonora
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A bug that involves the server is only reproducible
        with the server facts below; please fill them in.
  - type: input
    id: app_version
    attributes:
      label: Sonora version
      description: Settings → About, or the APK file name.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - Navidrome
        - Jellyfin + Subfin
        - Gonic
        - Airsonic / Airsonic-Advanced
        - Other Subsonic / OpenSubsonic
    validations:
      required: true
  - type: input
    id: server_version
    attributes:
      label: Server version
      description: The version the server reports (Navidrome's About page, Jellyfin's dashboard).
      placeholder: "0.64.2"
    validations:
      required: true
  - type: input
    id: server_url
    attributes:
      label: Server URL shape
      description: Scheme and port only, no host name or credentials if you prefer.
      placeholder: "https://music.example"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: |
        Settings → About → Copy debug report (or the log the app offers in a beta build).
        Remove anything you do not want to share; the report already redacts credentials.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a request for Spotify features or DRM circumvention.
          required: true
