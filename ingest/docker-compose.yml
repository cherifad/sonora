# Example: Navidrome + sonora-ingest, sharing one music folder.
# Copy to docker-compose.yml, set INGEST_TOKEN and NAVIDROME_PASSWORD, then:
#   docker compose up -d
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    ports:
      - "4533:4533"
    volumes:
      - ./music:/music
    environment:
      ND_MUSICFOLDER: /music
      # The app triggers scans itself; the periodic scan can stay off.
      ND_SCANSCHEDULE: "0"
    restart: unless-stopped

  ingest:
    build: .
    ports:
      - "8088:8088"
    # The container must be able to write the music folder; use the host user.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./music:/music
    environment:
      TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN}
      LIBRARY_PATH: /music
      INCOMING_PATH: /music/.sonora-ingest
      SERVER_TYPE: navidrome
      SCAN_URL: http://navidrome:4533
      SCAN_USER: "admin"
      SCAN_PASSWORD: "1234"
    depends_on:
      - navidrome
    restart: unless-stopped
